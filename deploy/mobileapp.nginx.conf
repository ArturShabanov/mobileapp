server {
    listen 80;
    listen [::]:80;
    server_name mobileapp.kz www.mobileapp.kz mobileapp.185-212-129-244.sslip.io;
    return 301 https://mobileapp.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mobileapp.kz www.mobileapp.kz;

    ssl_certificate /etc/letsencrypt/live/mobileapp.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobileapp.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.mobileapp.kz) {
        return 301 https://mobileapp.kz$request_uri;
    }

    root /var/www/mobileapp/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|ico|ttf|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mobileapp.185-212-129-244.sslip.io;

    ssl_certificate /etc/letsencrypt/live/mobileapp.185-212-129-244.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobileapp.185-212-129-244.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mobileapp.kz$request_uri;
}
